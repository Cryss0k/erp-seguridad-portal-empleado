{% extends "base.html" %}
{% block content %}
<h2>Portal del Empleado - Iniciar sesión</h2>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="rut">RUT:</label><br>
    <input type="text" id="rut" name="rut" maxlength="12" autocomplete="username" required><br>
    <label for="password">Contraseña:</label><br>
    <input type="password" id="password" name="password" maxlength="128" autocomplete="current-password" required><br>
    <button type="submit">Ingresar</button>
</form>
{% endblock %}
