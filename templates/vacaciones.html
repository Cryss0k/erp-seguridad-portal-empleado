{% extends "base.html" %}
{% block content %}
<h2>Solicitud de Vacaciones</h2>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="fecha_inicio">Fecha inicio:</label><br>
    <input type="text" id="fecha_inicio" name="fecha_inicio" placeholder="AAAA-MM-DD" maxlength="10" required><br>
    <label for="fecha_fin">Fecha fin:</label><br>
    <input type="text" id="fecha_fin" name="fecha_fin" placeholder="AAAA-MM-DD" maxlength="10" required><br>
    <label for="motivo">Motivo:</label><br>
    <input type="text" id="motivo" name="motivo" maxlength="200"><br>
    <button type="submit">Solicitar</button>
</form>

<h3>Mis solicitudes</h3>
<table>
    <tr><th>Inicio</th><th>Fin</th><th>Motivo</th><th>Estado</th></tr>
    {% for s in solicitudes %}
    <tr><td>{{ s['fecha_inicio'] }}</td><td>{{ s['fecha_fin'] }}</td><td>{{ s['motivo'] }}</td><td>{{ s['estado'] }}</td></tr>
    {% endfor %}
</table>
{% endblock %}
