<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Portal del Empleado - Seguridad LTDA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% if session.get('empleado_id') %}
    <nav>
        <a href="{{ url_for('dashboard') }}">Inicio</a>
        <a href="{{ url_for('liquidaciones') }}">Liquidaciones</a>
        <a href="{{ url_for('vacaciones') }}">Vacaciones</a>
        <a href="{{ url_for('datos_personales') }}">Mis Datos</a>
        <form method="POST" action="{{ url_for('logout') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="enlace">Cerrar sesión</button>
        </form>
    </nav>
    <hr>
    {% endif %}
    {% block content %}{% endblock %}
</body>
</html>
