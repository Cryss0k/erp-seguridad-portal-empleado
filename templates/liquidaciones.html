{% extends "base.html" %}
{% block content %}
<h2>Mis Liquidaciones de Sueldo</h2>
<table>
    <tr><th>Período</th><th>Monto líquido</th><th>Detalle</th></tr>
    {% for l in liquidaciones %}
    <tr>
        <td>{{ l.periodo }}</td>
        <td>{{ l.monto }}</td>
        <td><a href="{{ url_for('liquidacion_detalle', liq_id=l.id) }}">Ver detalle</a></td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
